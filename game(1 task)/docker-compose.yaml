name: schnapsen-66

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: ${SCHNAPSEN_DB_PASSWORD:-schnapsen_demo}
      POSTGRES_DB: schnapsen_66
      TZ: UTC
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./functions.sql:/docker-entrypoint-initdb.d/02-functions.sql:ro
      - ./sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres_data:
